<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generar QR — Armex Capital</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f4f6fb;
      padding: 2rem;
      color: #0f0b77;
    }
    h1 { text-align: center; margin-bottom: 2rem; font-size: 1.5rem; }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(15,11,119,0.1);
      width: 220px;
    }
    .card h2 { font-size: 0.95rem; margin-bottom: 0.4rem; }
    .card p { font-size: 0.75rem; color: #888; margin-bottom: 1rem; }
    .qr-box { margin: 0 auto 1rem; display: flex; justify-content: center; }
    .qr-box canvas, .qr-box img { border-radius: 8px; }
    button {
      background: #0f0b77;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.2rem;
      font-size: 0.85rem;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #1a15a0; }
  </style>
</head>
<body>
  <h1>QR Codes — Equipo Armex Capital</h1>
  <div class="grid" id="grid"></div>

  <script>
    const personas = [
      { nombre: "Javier Mendoza Pardo",   slug: "javier"   },
      { nombre: "Marisol Salas Arce",     slug: "marisol"  },
      { nombre: "Gabriela Salas Arce",    slug: "gabriela" },
      { nombre: "Angel Yael Camarillo",   slug: "yael"     },
    ];

    personas.forEach(p => {
      const url = `https://armexcapital.com/equipo/${p.slug}`;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h2>${p.nombre}</h2>
        <p>${url}</p>
        <div class="qr-box" id="qr-${p.slug}"></div>
        <button onclick="descargar('${p.slug}', '${p.nombre}')">Descargar QR</button>
      `;
      document.getElementById('grid').appendChild(card);

      new QRCode(document.getElementById(`qr-${p.slug}`), {
        text: url,
        width: 160,
        height: 160,
        colorDark: "#0f0b77",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    });

    function descargar(slug, nombre) {
      const canvas = document.querySelector(`#qr-${slug} canvas`);
      if (!canvas) { alert('Espera a que cargue el QR'); return; }
      const link = document.createElement('a');
      link.download = `QR-${slug}-armexcapital.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
