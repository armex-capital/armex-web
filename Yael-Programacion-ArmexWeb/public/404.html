<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Armex Capital</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #0D1117;
      color: #E6E6E6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 480px; }
    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 2px;
      margin-bottom: 3rem;
    }
    .code {
      font-size: 6rem;
      font-weight: 800;
      color: #0f0b77;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.88rem;
      color: #8B949E;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .btn {
      display: inline-block;
      padding: 0.85rem 2rem;
      background: #0f0b77;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    .btn:hover { background: #3d39c4; }
  </style>
</head>
<body>
  <div class="container">
    <p class="logo">Armex Capital</p>
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La página que buscas no existe o fue movida.<br/>Regresa al inicio para continuar.</p>
    <a href="/" class="btn">Ir al inicio</a>
  </div>
</body>
</html>
